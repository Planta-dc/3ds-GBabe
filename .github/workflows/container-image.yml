name: container image

# Publishes the build image that build.yml and the devcontainer use. The tag is
# a hash of everything that defines the image (docker/build-image.sh), so this
# only has work to do when one of those files changes - a build either finds its
# image already published or builds one here.

on:
  push:
    branches: [main]
    paths:
      - docker/gbabe-devcontainer.Dockerfile
      - .github/scripts/install-3ds-packaging-tools.sh
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: |
          image="$(bash docker/build-image.sh)"
          echo "IMAGE_NAME=${image%:*}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${image##*:}" >> "$GITHUB_ENV"
          echo "publishing $image"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gbabe-devcontainer.Dockerfile
          push: true
          # The hash tag is the one CI uses; "latest" is for people.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
